[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samskriti"
version = "0.3.0"
description = "Persistent emotional and relational state for AI characters. No LLM required."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Tarang Patel" }]
keywords = ["ai", "npc", "game-ai", "agents", "robotics", "character", "emotion", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Escalate17/samskriti"
Paper = "https://doi.org/10.5281/zenodo.20531430"

[project.scripts]
# One command after install. `samskriti` drops you straight into the interactive
# session — evaluating an engine should not start with downloading a second file.
samskriti = "samskriti.talk:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["samskriti"]
include-package-data = true
